[project]
name = "sparkplan"
version = "0.1.0"
description = "Plain-language hardware idea to validated parts list, printable enclosure, compiling firmware, and build guide."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "trimesh>=4.4",
    "cadquery>=2.4",
    "rtree>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "black>=24.4",
    "ruff>=0.4",
]
# Install the build123d fallback ONLY when CadQuery's OCP stack cannot be
# installed: build123d pulls cadquery-ocp-novtk, whose stub IVtk bindings
# break `import cadquery`. The geometry engine picks whichever is available.
build123d = [
    "build123d>=0.5",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sparkplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sparkplan", "catalog", "api", "eval", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]
