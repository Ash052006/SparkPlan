name: Hardware-in-the-Loop (HIL) Silicon CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hil-silicon-test:
    name: ESP32 Silicon Flash & Boot Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install esptool pyserial

      - name: Run Hardware-in-the-Loop Silicon Verification
        run: |
          python scripts/hil_runner.py --mock
