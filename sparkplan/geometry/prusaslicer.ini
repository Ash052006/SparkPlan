# SparkPlan controlled PrusaSlicer profile.
#
# This is not a printer-specific tuning profile.  It is a small, explicit
# profile for the CI slicer check: a 220 x 220 x 250 mm bed, a 0.4 mm nozzle,
# PLA at 210 C / 60 C, and a 0.2 mm layer height.  Keep it version-controlled
# so slicing does not depend on a developer's local PrusaSlicer presets.

printer_technology = FFF
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
extruder_count = 1
filament_diameter = 1.75

layer_height = 0.2
first_layer_height = 0.2
perimeters = 2
fill_density = 20%
fill_pattern = grid
top_solid_layers = 3
bottom_solid_layers = 3
skirts = 1
brim_width = 0
support_material = 0

filament_type = PLA
temperature = 210
first_layer_temperature = 210
bed_temperature = 60
first_layer_bed_temperature = 60
gcode_flavor = marlin
use_relative_e_distances = 0

start_gcode = G21 ; millimetres\nG90 ; absolute coordinates\nM82 ; absolute extruder\nG28 ; home\nG1 Z5 F5000 ; lift nozzle
end_gcode = M104 S0 ; hotend off\nM140 S0 ; bed off\nG28 X0 ; home X\nM84 ; disable motors
